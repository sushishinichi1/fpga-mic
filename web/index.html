<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>INMP441 Debug Monitor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="title">
        <h1>INMP441 Debug Monitor</h1>
        <p>Tang Nano 9K / Web Serial / 115200 bps</p>
      </div>
      <div class="actions">
        <button id="connectButton" type="button">&#25509;&#32154;</button>
        <button id="disconnectButton" type="button" disabled>&#20999;&#26029;</button>
      </div>
    </header>

    <section class="meter">
      <div class="readout">
        <span>&#29694;&#22312;&#12398;&#38899;&#37327;</span>
        <output id="volumeValue">0</output>
      </div>
      <div class="bar" aria-label="volume bar">
        <div id="volumeBar" class="bar-fill"></div>
      </div>
      <div class="graph-wrap">
        <canvas id="historyCanvas" aria-label="volume history"></canvas>
      </div>
    </section>

    <section class="debug">
      <div class="debug-item">
        <span>RAW sample</span>
        <output id="rawValue">---</output>
      </div>
      <div class="debug-item">
        <span>PEAK</span>
        <output id="peakValue">---</output>
      </div>
      <div class="debug-item">
        <span>VOL</span>
        <output id="debugVolumeValue">---</output>
      </div>
      <div class="debug-item">
        <span>UART</span>
        <output id="uartStatus">stopped</output>
      </div>
      <div class="debug-item">
        <span>Lines/sec</span>
        <output id="linesPerSecond">0</output>
      </div>
      <div class="debug-item wide">
        <span>Last line</span>
        <output id="lastLine">---</output>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
