<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>INMP441 Music Analyzer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="title">
        <h1>INMP441 Music Analyzer</h1>
        <p>Tang Nano 9K / Web Serial / 115200 bps</p>
      </div>
      <div class="actions">
        <button id="connectButton" type="button">&#25509;&#32154;</button>
        <button id="disconnectButton" type="button" disabled>&#20999;&#26029;</button>
      </div>
    </header>

    <section class="dashboard">
      <section class="volume-panel" aria-label="volume">
        <div class="readout">
          <span>Volume</span>
          <output id="volumeValue">0</output>
        </div>
        <div class="bar volume-bar" aria-label="volume bar">
          <div id="volumeBar" class="bar-fill volume-fill"></div>
        </div>
        <div class="stats">
          <div>
            <span>Peak</span>
            <output id="peakValue">0</output>
          </div>
          <div>
            <span>RMS</span>
            <output id="rmsValue">0</output>
          </div>
        </div>
      </section>

      <section class="bands" aria-label="frequency bands">
        <div class="band-row">
          <span>LOW</span>
          <div class="bar"><div id="lowBar" class="bar-fill low-fill"></div></div>
          <output id="lowValue">0</output>
        </div>
        <div class="band-row">
          <span>MID</span>
          <div class="bar"><div id="midBar" class="bar-fill mid-fill"></div></div>
          <output id="midValue">0</output>
        </div>
        <div class="band-row">
          <span>HIGH</span>
          <div class="bar"><div id="highBar" class="bar-fill high-fill"></div></div>
          <output id="highValue">0</output>
        </div>
      </section>

      <section class="spectrum-panel" aria-label="FFT spectrum analyzer">
        <div class="spectrum-title">Spectrum Analyzer</div>
        <div id="spectrumBars" class="spectrum-bars" aria-label="32 spectrum bands"></div>
        <div class="spectrum-scale" aria-hidden="true">
          <span>137Hz</span>
          <span>1kHz</span>
          <span>3kHz</span>
          <span>10kHz</span>
          <span>17kHz</span>
        </div>
      </section>

      <section class="graph-wrap" aria-label="history">
        <canvas id="historyCanvas" aria-label="volume history"></canvas>
      </section>
    </section>

    <section class="debug">
      <div class="debug-item">
        <span>RAW</span>
        <output id="rawValue">---</output>
      </div>
      <div class="debug-item">
        <span>UART</span>
        <output id="uartStatus">stopped</output>
      </div>
      <div class="debug-item">
        <span>Lines/sec</span>
        <output id="linesPerSecond">0</output>
      </div>
      <div class="debug-item">
        <span>FFT Peak Bin</span>
        <output id="fftBinValue">---</output>
      </div>
      <div class="debug-item">
        <span>Dominant Frequency</span>
        <output id="dominantFrequency">--- Hz</output>
      </div>
      <div class="debug-item">
        <span>FFT Power</span>
        <output id="fftPowerValue">---</output>
      </div>
      <div class="debug-item beat-readout">
        <span>BEAT</span>
        <span id="beatIndicator" class="beat-indicator" aria-label="beat indicator"></span>
      </div>
      <div class="debug-item">
        <span>Beat Count</span>
        <output id="beatCountValue">0</output>
      </div>
      <div class="debug-item bpm-readout">
        <span>BPM</span>
        <output id="bpmValue">--</output>
      </div>
      <div class="debug-item wide">
        <span>Last line</span>
        <output id="lastLine">---</output>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
